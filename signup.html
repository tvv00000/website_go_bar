<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - GO BAR</title>
  <link rel="stylesheet" href="sass.css" />
  <script src="./js/signup.js" defer></script>
  <script src="./js/main.js" defer></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <img src="./img/go_bar_white.svg" alt="GO BAR logo">
    </a>
    <button class="burger" id="burger" aria-label="Open navigation menu">☰</button>
    <nav id="nav">
      <a href="index.html"><img src="./img/home.png" width="36px" height="36px" alt="">Home</a>
    </nav>
  </header>
  <section class="signup">
    <h2>Create an account</h2>
    <p>Join GO BAR community</p>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name" />
      <span class="error" id="nameError"></span>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your email" />
      <span class="error" id="emailError"></span>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" />
      <span class="error" id="passwordError"></span>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Confirm password" />
      <span class="error" id="confirmError"></span>

      <button type="submit">Sign up</button>
    </form>
  </section>
</body>
</html>
